services:
  - type: web
    name: agrocebada-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r api/requirements.txt -r ml/requirements-inference.txt -r ml/requirements-advanced.txt
    startCommand: uvicorn api.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CEBADA_MODE
        value: real
      - key: CEBADA_DATA
        value: data/deploy/data
      - key: CEBADA_DELIVERY
        value: data/deploy/delivery
      - key: CEBADA_LOG_LEVEL
        value: INFO
      - key: CEBADA_ALLOWED_ORIGINS
        sync: false   # completar después del deploy del frontend: https://<tu-app>.vercel.app
